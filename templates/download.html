{% extends "template.html" %}
{% block body %}
<section id="content">
	<h3 class="cyber-h">Download</h3>
	<p>Your deck is ready!</p>
	<a href="{{ deck_link }}" download="download" class="cyber-button" style="display: block">Download PDF</a>
	<br>
	<br>
	<a class="start_again" style="display: block" href="/">Start again</a>
	<div id="support_banner" class="cyber-razor-top bg-dark fg-white p-3 mt-4">
		<div>
			<p>If you found this tool useful, help keep it free and ad-free for everyone with a donation:</p>
			<script type='text/javascript' src='https://storage.ko-fi.com/cdn/widget/Widget_2.js'></script><script type='text/javascript'>kofiwidget2.init('Send me some eddies', '#707070', 'F1F7326TN');kofiwidget2.draw();</script>
		</div>
	</div>
</section>
<div id="loading_backdrop">
	<div id="loading_spinner" class="code-block mt-6" style="padding: 2em">
		<span>Loading...</span>
		<div class="progress"></div>

		<style>
		.progress {
		   height: 4.5px;
		   width: 145.6px;
		   background: linear-gradient(#00ffd2 0 0),
		       linear-gradient(#00ffd2 0 0),
		       #333333;
		   background-size: 60% 100%;
		   background-repeat: no-repeat;
		   animation: progress-7x9cg2 4.199999999999999s infinite;
		}

		@keyframes progress-7x9cg2 {
		   0% {
		      background-position: -150% 0,-150% 0;
		   }

		   66% {
		      background-position: 250% 0,-150% 0;
		   }

		   100% {
		      background-position: 250% 0, 250% 0;
		   }
		}
		</style>
	</div>
</div>
{% endblock %}
{% block scripts %}
<script>
	function submit_decklist() {
		var loading_spinner = document.querySelector('#loading_backdrop');
		loading_spinner.style.display = 'flex';
		var form = document.querySelector('#generate_form');
		form.submit()
	}
</script>
{% endblock %}
