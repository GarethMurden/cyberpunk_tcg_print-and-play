{% extends "template.html" %}
{% block body %}
<section id="content">
	<h3 class="cyber-h">Preview</h3>
	{% if not_found != [] %}
		<div class="cyber-att-2">Warning! Some cards could not be found</div>
		<div class="code-block mt-6">
			<ul>
			{% for card in not_found %}
				<li>{{ card }}</li>
			{% endfor %}
			</ul>
		</div>
	{% endif %}
	
	<form id="generate_form" method="POST">
		<input type="hidden" name="deck_id" value="{{ deck_id }}">
	</form>
	<div class="cyber-button" onclick="submit_decklist()">Download PDF</div>
</section>
<div id="loading_backdrop">
	<div id="loading_spinner" class="code-block mt-6">
		<span>Loading...</span>
		<div class="progress"></div>

		<style>
		.progress {
		   height: 4.5px;
		   width: 145.6px;
		   background: linear-gradient(#00ffd2 0 0),
		       linear-gradient(#00ffd2 0 0),
		       #333333;
		   background-size: 60% 100%;
		   background-repeat: no-repeat;
		   animation: progress-7x9cg2 4.199999999999999s infinite;
		}

		@keyframes progress-7x9cg2 {
		   0% {
		      background-position: -150% 0,-150% 0;
		   }

		   66% {
		      background-position: 250% 0,-150% 0;
		   }

		   100% {
		      background-position: 250% 0, 250% 0;
		   }
		}
		</style>
	</div>
</div>
{% endblock %}
{% block scripts %}
<script>
	function submit_decklist() {
		var loading_spinner = document.querySelector('#loading_backdrop');
		loading_spinner.style.display = 'flex';
		var form = document.querySelector('#generate_form');
		form.submit()
	}
</script>
{% endblock %}
